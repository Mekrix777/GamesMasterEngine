name: Build Android APK (Free Cloud Build)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Pobieranie kodu z repozytorium
      uses: actions/checkout@v4

    - name: Konfiguracja środowiska Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Konfiguracja .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalacja obciążenia MAUI Android
      run: dotnet workload install maui-android

    - name: Kompilacja projektu do pliku .APK
      run: dotnet build GamesMasterEngine.csproj -c Release -f net8.0-android

    - name: Zapisanie gotowego pliku .APK do pobrania
      uses: actions/upload-artifact@v4
      with:
        name: GamesMasterEngine-Android-APK
        path: '**/bin/Release/net8.0-android/*/*.apk'
