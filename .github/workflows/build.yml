name: GamesMasterEngine - Hybrid Core Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-hybrid-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Pobieranie kodu z repozytorium
      uses: actions/checkout@v4

    - name: Konfiguracja .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Przywrócenie zależności projektu
      run: dotnet restore GamesMasterEngine.csproj

    - name: Kompilacja hybrydowa (.NET 8 Core)
      run: dotnet publish GamesMasterEngine.csproj -c Release -r linux-arm64 --self-contained true -o publish

    - name: Zapisanie silnika z C++ i C# (#WszystkoTwoje)
      uses: actions/upload-artifact@v4
      with:
        name: GamesMasterEngine-HybridCore
        path: 'publish/*'
